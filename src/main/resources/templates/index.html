<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <title>Spring Security Example</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            background-color: #f5f5f5;
        }
        .form-signin {
            max-width: 330px;
            padding: 15px;
        }
        .form-signin .form-floating:focus-within {
            z-index: 2;
        }
        .form-signin input[type="text"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }
        .form-signin input[type="password"] {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
    </style>
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
<main class="form-signin w-100 m-auto text-center">
    <h1 class="h3 mb-3 fw-normal">Вход</h1>

    <div th:if="${param.error}" class="alert alert-danger py-2" role="alert">
        Неправильное имя или пароль
    </div>

    <div th:if="${param.logout}" class="alert alert-success py-2" role="alert">
        Вы вышли
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-floating">
            <input type="text" class="form-control" id="floatingInput" name="username" placeholder="Введите логин" required>
            <label for="floatingInput">Логин:</label>
        </div>
        <br>
        <div class="form-floating">
            <input type="password" class="form-control" id="floatingPass" name="password" placeholder="Введите пароль" required>
            <label for="floatingPass">Пароль:</label>
        </div>
        <br>
        <button class="btn btn-primary w-100 py-2" type="submit">Войти</button>
    </form>

</main>

</body>
</html>
