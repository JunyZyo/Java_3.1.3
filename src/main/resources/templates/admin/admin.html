<!DOCTYPE html>
<!--<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Spring Security Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .navbar {
            background-color: #171921;
            border-bottom: 1px solid #dee2e6;
            padding: 8px 0;
        }
        .navbar-brand {
            font-size: 16px;
            color: #ffffff;
            font-weight: 400;
        }
        .navbar-brand:hover {
            color: #ffffff;
        }
        .navbar-text {
            font-size: 14px;
            color: #ffffff;
        }
        .badge-role {
            background-color: #198754;
            font-weight: 400;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .badge-role-admin {
            background-color: #dc3545;
            font-weight: 400;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .btn-logout {
            font-size: 14px;
            color: #dc3545;
            border: 1px solid #dc3545;
            background: transparent;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-logout:hover {
            background-color: #dc3545;
            color: #fff;
        }

        .page-title {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #212529;
        }
        .page-subtitle {
            font-size: 16px;
            color: #6c757d;
            margin-bottom: 20px;
        }

        /* CSS-табы */
        .tabs {
            display: flex;
            flex-wrap: wrap;
        }
        .tabs input[type="radio"] {
            display: none;
        }
        .tabs label {
            padding: 10px 20px;
            font-size: 16px;
            color: #6c757d;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tabs input[type="radio"]:checked + label {
            color: #212529;
            border-bottom: 2px solid #0d6efd;
        }

        .tab-content {
            display: none;
            width: 100%;
        }

        /* Показываем первый таб когда выбрана первая радио-кнопка */
        #tab1:checked ~ #content1,
        #tab2:checked ~ #content2 {
            display: block;
        }

        .card {
            border: 1px solid #dee2e6;
            border-radius: 4px;
            box-shadow: none;
        }
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            font-size: 16px;
            font-weight: 500;
            color: #212529;
            padding: 12px 16px;
        }

        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #fff;
            font-weight: 500;
            color: #212529;
            font-size: 14px;
            padding: 10px 16px;
            border-bottom: 2px solid #dee2e6;
        }
        .table td {
            font-size: 14px;
            padding: 10px 16px;
            color: #212529;
            vertical-align: middle;
        }
        .table tr {
            border-bottom: 1px solid #dee2e6;
        }
        .table tr:last-child {
            border-bottom: none;
        }

        .btn-edit {
            font-size: 13px;
            color: #0d6efd;
            border: 1px solid #0d6efd;
            background: transparent;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-edit:hover {
            background-color: #0d6efd;
            color: #fff;
        }
        .btn-delete {
            font-size: 13px;
            color: #dc3545;
            border: 1px solid #dc3545;
            background: transparent;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-delete:hover {
            background-color: #dc3545;
            color: #fff;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #212529;
            margin-bottom: 4px;
        }
        .form-control {
            font-size: 14px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 8px 12px;
        }
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
            outline: none;
        }
        .btn-add {
            font-size: 14px;
            padding: 8px 20px;
            border-radius: 4px;
        }

        .form-check-input:checked {
            background-color: #198754;
            border-color: #198754;
        }




    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <span class="navbar-brand" th:text="${currentUser.email}">admin@mail.ru</span>
        <span class="navbar-text">
                Роли
                <span th:each="role : ${currentUser.roles}"
                      th:class="${role.name == 'ROLE_ADMIN'} ? 'badge-role-admin ms-1' : 'badge-role ms-1'"
                      th:text="${role.name}">Админ</span>
            </span>
        <form th:action="@{/logout}" method="post" class="ms-auto">
            <button type="submit" class="btn-logout">Выйти</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="page-title">Админ</h1>
    <p class="page-subtitle">Панель админа</p>

    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

    <div class="tabs">
        <input type="radio" name="tabs" id="tab1" checked="checked">
        <label for="tab1">Таблица пользователей</label>

        <input type="radio" name="tabs" id="tab2">
        <label for="tab2">Новый пользователь</label>

        <div class="tab-content" id="content1">
            <div class="card">
                <div class="card-header">Таблица пользователей</div>
                <div class="card-body p-0">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Фамилия</th>
                            <th>Почта</th>
                            <th>Роль</th>
                            <th></th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.firstName}">admin</td>
                            <td th:text="${user.lastName}">admin</td>
                            <td th:text="${user.email}">admin@mail.ru</td>
                            <td>
                                        <span th:each="role : ${user.roles}"
                                              th:class="${role.name == 'ROLE_ADMIN'} ? 'badge-role-admin me-1' : 'badge-role me-1'"
                                              th:text="${role.name}">Админ</span>
                            </td>
                            <td>

                                <button type="button" class="btn-edit"
                                        data-bs-toggle="modal"
                                        th:attr="data-bs-target='#editModal' + ${user.id}">
                                    Изменить
                                </button>

                            </td>
                            <td>
                                <button type="button" class="btn-delete"
                                        data-bs-toggle="modal"
                                        th:attr="data-bs-target='#deleteModal' + ${user.id}">
                                    Удалить
                                </button>
                                <!--                                <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" style="display: inline;">-->
                                <!--                                    <button type="submit" class="btn-delete">Удалить</button>-->
                                <!--                                </form>-->
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Новый пользователь -->
        <div class="tab-content" id="content2">
            <div class="card">
                <div class="card-header">Новый пользователь</div>
                <div class="card-body">
                    <form th:action="@{/admin/users}" method="post" th:object="${newUser}">
                        <div class="mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Имя</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Фамилия</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Почта</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Пароль</label>
                                <input type="password" class="form-control" th:field="*{password}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Роль</label>
                                <div class="d-flex gap-3">
                                    <div th:each="role : ${allRoles}" class="form-check">
                                        <input type="checkbox" class="form-check-input"
                                               name="roleIds" th:value="${role.id}">
                                        <label class="form-check-label" th:text="${role.name}">ROLE_USER</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success btn-add">Добавить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно изменения -->
<div th:each="user : ${users}">
    <div class="modal fade" th:id="'editModal' + ${user.id}" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Изменить пользователя</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label">ID</label>
                            <input type="text" class="form-control" th:value="${user.id}" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Имя</label>
                            <input type="text" class="form-control" name="firstName" th:value="${user.firstName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Фамилия</label>
                            <input type="text" class="form-control" name="lastName" th:value="${user.lastName}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Почта</label>
                            <input type="email" class="form-control" name="email" th:value="${user.email}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" class="form-control" name="password" placeholder="Можно оставить пустым">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Роль</label>
                            <div class="d-flex gap-3">
                                <div th:each="role : ${allRoles}" class="form-check">
                                    <input type="checkbox" class="form-check-input" name="roleIds"
                                           th:value="${role.id}" th:checked="${user.roles.contains(role)}">
                                    <label class="form-check-label" th:text="${role.name}"></label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex gap-2 justify-content-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                            <button type="submit" class="btn btn-primary">Изменить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно удаления -->
<div th:each="user : ${users}">
    <div class="modal fade" th:id="'deleteModal' + ${user.id}" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Удалить пользователя</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Вы уверены, что хотите удалить пользователя <strong th:text="${user.firstName} + ' ' + ${user.lastName}"></strong>?</p>

                    <div class="mb-3">
                        <label class="form-label">ID</label>
                        <input type="text" class="form-control" th:value="${user.id}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Имя</label>
                        <input type="text" class="form-control" th:value="${user.firstName}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Фамилия</label>
                        <input type="text" class="form-control" th:value="${user.lastName}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Почта</label>
                        <input type="email" class="form-control" th:value="${user.email}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Роль</label>
                        <div class="d-flex gap-3">
                            <div th:each="role : ${allRoles}" class="form-check">
                                <input type="checkbox" class="form-check-input"
                                       th:checked="${user.roles.contains(role)}" disabled>
                                <label class="form-check-label" th:text="${role.name}"></label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                        <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" style="display: inline;">
                            <button type="submit" class="btn btn-danger">Удалить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
