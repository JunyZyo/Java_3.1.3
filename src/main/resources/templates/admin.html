<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
    <title>Spring Security Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .navbar {
            background-color: #fff !important;
            border-bottom: 1px solid #dee2e6;
            padding: 8px 0;
        }
        .navbar-brand {
            font-size: 16px;
            color: #212529;
            font-weight: 400;
        }
        .navbar-text {
            font-size: 14px;
            color: #6c757d;
        }
        .badge-role {
            background-color: #198754;
            font-weight: 400;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .badge-role-admin {
            background-color: #dc3545;
            font-weight: 400;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .btn-logout {
            font-size: 14px;
            color: #dc3545;
            border: 1px solid #dc3545;
            background: transparent;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-logout:hover {
            background-color: #dc3545;
            color: #fff;
        }

        .page-title {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #212529;
        }
        .page-subtitle {
            font-size: 16px;
            color: #6c757d;
            margin-bottom: 20px;
        }

        .nav-tabs .nav-link {
            color: #6c757d;
            border: none;
            font-size: 16px;
            padding: 10px 20px;
        }
        .nav-tabs .nav-link.active {
            color: #212529;
            border-bottom: 2px solid #0d6efd;
            background: transparent;
        }

        .card {
            border: 1px solid #dee2e6;
            border-radius: 4px;
            box-shadow: none;
            border-top: none;
        }
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            font-size: 16px;
            font-weight: 500;
            color: #212529;
            padding: 12px 16px;
        }

        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #fff;
            font-weight: 500;
            color: #212529;
            font-size: 14px;
            padding: 10px 16px;
            border-bottom: 2px solid #dee2e6;
        }
        .table td {
            font-size: 14px;
            padding: 10px 16px;
            color: #212529;
            vertical-align: middle;
        }
        .table tr {
            border-bottom: 1px solid #dee2e6;
        }
        .table tr:last-child {
            border-bottom: none;
        }

        .btn-edit {
            font-size: 13px;
            color: #0d6efd;
            border: 1px solid #0d6efd;
            background: transparent;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-edit:hover {
            background-color: #0d6efd;
            color: #fff;
        }
        .btn-delete {
            font-size: 13px;
            color: #dc3545;
            border: 1px solid #dc3545;
            background: transparent;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-delete:hover {
            background-color: #dc3545;
            color: #fff;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #212529;
            margin-bottom: 4px;
        }
        .form-control {
            font-size: 14px;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 8px 12px;
        }
        .form-control:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
        }
        .btn-add {
            font-size: 14px;
            padding: 8px 20px;
            border-radius: 4px;
        }

        .form-check-input:checked {
            background-color: #198754;
            border-color: #198754;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container">
        <span class="navbar-brand" th:text="${currentUser.email}">admin@mail.ru</span>
        <span class="navbar-text">
                with roles:
                <span th:each="role : ${currentUser.roles}"
                      th:class="${role.name == 'ROLE_ADMIN'} ? 'badge-role-admin ms-1' : 'badge-role ms-1'"
                      th:text="${role.name}">ADMIN</span>
            </span>
        <form th:action="@{/logout}" method="post" class="ms-auto">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<!-- Основной контент -->
<div class="container mt-4">
    <h1 class="page-title">Admin</h1>
    <p class="page-subtitle">Admin panel</p>

    <!-- Сообщения -->
    <div th:if="${success}" class="alert alert-success py-2" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

    <!-- Табы -->
    <ul class="nav nav-tabs" id="adminTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="users-tab" data-bs-toggle="tab"
                    data-bs-target="#users" type="button" role="tab">
                Users table
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="newuser-tab" data-bs-toggle="tab"
                    data-bs-target="#newuser" type="button" role="tab">
                New User
            </button>
        </li>
    </ul>

    <!-- Содержимое табов -->
    <div class="tab-content" id="adminTabsContent">

        <!-- Таб: Users table -->
        <div class="tab-pane fade show active" id="users" role="tabpanel">
            <div class="card">
                <div class="card-header">
                    Users table
                </div>
                <div class="card-body p-0">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">2</td>
                            <td th:text="${user.firstName}">admin</td>
                            <td th:text="${user.lastName}">admin</td>
                            <td th:text="${user.email}">admin@mail.ru</td>
                            <td>
                                        <span th:each="role : ${user.roles}"
                                              th:class="${role.name == 'ROLE_ADMIN'} ? 'badge-role-admin me-1' : 'badge-role me-1'"
                                              th:text="${role.name}">ADMIN</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/users/{id}/edit(id=${user.id})}"
                                   class="btn-edit">Edit</a>
                            </td>
                            <td>
                                <a th:href="@{/admin/users/{id}/delete(id=${user.id})}"
                                   class="btn-delete">Delete</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Таб: New User -->
        <div class="tab-pane fade" id="newuser" role="tabpanel">
            <div class="card">
                <div class="card-header">
                    New User
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/users}" method="post" th:object="${newUser}">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" th:field="*{lastName}" required>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" th:field="*{email}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" th:field="*{password}" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Role</label>
                            <div class="d-flex gap-3">
                                <div th:each="role : ${allRoles}" class="form-check">
                                    <input type="checkbox" class="form-check-input"
                                           name="roleIds" th:value="${role.id}">
                                    <label class="form-check-label" th:text="${role.name}">ROLE_USER</label>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success btn-add">Add</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
